<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blooket Clone</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div id="login-screen">
      <h2>Login</h2>
      <input type="text" id="username" placeholder="Enter your username" />
      <button onclick="login()">Start</button>
    </div>

    <div id="dashboard" class="hidden">
      <h2>Welcome, <span id="user-name"></span>!</h2>
      <p>XP: <span id="xp-display">0</span></p>
      <div class="nav">
        <button onclick="showPage('create-set')">➕ Create Set</button>
        <button onclick="showPage('discover-sets')">🔍 Discover Sets</button>
      </div>
    </div>

    <div id="create-set" class="hidden">
      <h3>Create New Set</h3>
      <input type="text" id="set-title" placeholder="Set Title" />
      <textarea id="set-desc" placeholder="Description"></textarea>
      <div id="question-list"></div>
      <button onclick="addQuestion()">Add Question</button>
      <button onclick="saveSet()">✅ Save Set</button>
      <button onclick="showPage('dashboard')">← Back</button>
    </div>

    <div id="discover-sets" class="hidden">
      <h3>Your Sets</h3>
      <div id="set-display"></div>
      <button onclick="showPage('dashboard')">← Back</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
